name: Browser application tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r web/requirements-dev.txt
      - run: python -m pytest web/tests -q
      - run: node --check web/static/app.js